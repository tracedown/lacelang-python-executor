[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "lacelang-executor"
dynamic = ["version"]
description = "Reference Python executor for the Lace probe scripting language. Depends on lacelang-validator for parsing and semantic checks."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "lacelang contributors" }]
keywords = ["lace", "lacelang", "executor", "http", "probe", "monitoring"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "lacelang-validator>=0.2.1,<0.3",
]

[tool.setuptools.package-data]
lacelang_executor = ["extensions/*.laceext", "extensions/*.config"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "mypy>=2.3.1",
    "ruff>=0.16.6,<0.17",
]

[project.scripts]
lacelang-executor = "lacelang_executor.cli:main"

[project.urls]
Homepage = "https://github.com/tracedown/lacelang-python-executor"
Validator = "https://github.com/tracedown/lacelang-python-validator"
Specification = "https://github.com/tracedown/lacelang"

[tool.setuptools.dynamic]
version = {attr = "lacelang_executor.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
